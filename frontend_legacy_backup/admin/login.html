<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 绿能充电后台</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        body {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo .icon {
            font-size: 3rem;
        }

        .login-logo h1 {
            color: #2d3436;
            margin-top: 10px;
            font-size: 1.5rem;
        }

        .login-logo p {
            color: #636e72;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-logo">
            <span class="icon">🔐</span>
            <h1>管理后台</h1>
            <p>请使用管理员账号登录</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 10px; background: #2d3436; padding: 14px;">
                登录管理后台
            </button>
        </form>

        <div class="text-center" style="margin-top: 20px; font-size: 0.9rem;">
            <a href="../index.html" style="color: #636e72; text-decoration: none;">← 返回用户端</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await API.login(data);

                if (response.data.role !== 1) {
                    alert('您没有管理员权限');
                    return;
                }

                localStorage.setItem('token', response.data.token);
                localStorage.setItem('user', JSON.stringify({
                    id: response.data.userId,
                    username: response.data.username,
                    role: response.data.role
                }));

                alert('登录成功！');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('登录失败: ' + error.message);
            }
        });
    </script>
</body>

</html>
