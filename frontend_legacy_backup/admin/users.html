<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 绿能充电后台</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="icon">⚡</span>
            <h2>绿能充电管理</h2>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html">
                <span class="icon">📊</span>
                <span>仪表盘</span>
            </a>
            <a href="stations.html">
                <span class="icon">🏢</span>
                <span>充电站管理</span>
            </a>
            <a href="users.html" class="active">
                <span class="icon">👥</span>
                <span>用户管理</span>
            </a>
            <a href="orders.html">
                <span class="icon">📋</span>
                <span>订单管理</span>
            </a>
            <a href="#" onclick="logout()">
                <span class="icon">🚪</span>
                <span>退出登录</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>用户管理</h1>
            <div class="flex gap-2">
                <input type="text" id="searchInput" class="form-control" placeholder="搜索用户名/手机号" style="width: 200px;">
                <button class="btn btn-outline" onclick="searchUsers()">搜索</button>
            </div>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>真实姓名</th>
                    <th>手机号</th>
                    <th>车牌</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr>
                    <td colspan="8" class="text-center">加载中...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAuth();
            loadUsers();
        });

        function checkAdminAuth() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const token = localStorage.getItem('token');
            if (!token || user.role !== 1) {
                window.location.href = 'login.html';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function loadUsers() {
            try {
                const response = await API.request('/admin/users');
                renderUsers(response.data);
            } catch (error) {
                console.error('Load users error:', error);
                document.getElementById('userList').innerHTML =
                    '<tr><td colspan="8" class="text-center" style="color: #d63031;">加载失败</td></tr>';
            }
        }

        async function searchUsers() {
            const keyword = document.getElementById('searchInput').value;
            try {
                const response = await API.request(`/admin/users?keyword=${encodeURIComponent(keyword)}`);
                renderUsers(response.data);
            } catch (error) {
                alert('搜索失败: ' + error.message);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userList');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.realName || '-'}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${u.carPlate || '-'}</td>
                    <td><span class="badge ${u.role === 1 ? 'badge-warning' : 'badge-success'}">${u.role === 1 ? '管理员' : '用户'}</span></td>
                    <td><span class="badge ${u.status === 1 ? 'badge-success' : 'badge-danger'}">${u.status === 1 ? '正常' : '禁用'}</span></td>
                    <td class="action-btns">
                        ${u.status === 1
                    ? `<button class="btn btn-danger" onclick="toggleUserStatus(${u.id}, 0)">禁用</button>`
                    : `<button class="btn btn-primary" onclick="toggleUserStatus(${u.id}, 1)">启用</button>`}
                    </td>
                </tr>
            `).join('');
        }

        async function toggleUserStatus(id, status) {
            if (!confirm(status === 0 ? '确定要禁用该用户吗？' : '确定要启用该用户吗？')) return;
            try {
                await API.request(`/admin/users/${id}/status?status=${status}`, { method: 'PUT' });
                alert('操作成功');
                loadUsers();
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }
    </script>
</body>

</html>
