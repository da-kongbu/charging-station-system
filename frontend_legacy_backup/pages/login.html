<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 绿能充电</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        <div class="text-center mb-2">
            <h1 style="color: var(--primary-color);">欢迎回来</h1>
            <p style="color: var(--text-light);">请登录您的账号</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">登录</button>
        </form>

        <div class="text-center mt-2" style="font-size: 0.9rem;">
            还没有账号？ <a href="register.html" style="color: var(--primary-color); font-weight: 600;">立即注册</a>
            <br>
            <a href="../index.html" style="color: var(--text-light); display: inline-block; margin-top: 10px;">返回首页</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await API.login(data);

                Auth.login(response.data.token, {
                    id: response.data.userId,
                    username: response.data.username,
                    role: response.data.role
                });

                showToast('登录成功！正在跳转...');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>

</html>
