<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的预约 - 绿能充电</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header></header>

    <main class="container" style="padding-top: 20px;">
        <h1 class="mb-2">我的预约</h1>

        <div id="reservationList">
            <div class="text-center">加载中...</div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.checkAuth();
            loadReservations();
        });

        async function loadReservations() {
            try {
                const response = await API.getMyReservations();
                renderReservations(response.data);
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        function renderReservations(list) {
            const container = document.getElementById('reservationList');

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="text-center card">暂无预约记录</div>';
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="card">
                    <div class="flex justify-between items-center mb-2">
                        <h3 style="color: var(--primary-color);">${item.stationName}</h3>
                        <span class="badge ${getStatusBadgeClass(item.status)}">${item.statusText}</span>
                    </div>
                    
                    <div class="grid grid-cols-2" style="font-size: 0.95rem; color: var(--text-color);">
                        <div><strong>车位：</strong> ${item.pileCode} - ${item.spotCode}</div>
                        <div><strong>车牌：</strong> ${item.carPlate || '-'}</div>
                        <div><strong>开始时间：</strong> ${formatDate(item.startTime)}</div>
                        <div><strong>结束时间：</strong> ${formatDate(item.endTime)}</div>
                        <div><strong>预估费用：</strong> ¥${item.estimatedCost}</div>
                        <div><strong>提交时间：</strong> ${formatDate(item.createdAt)}</div>
                    </div>

                    <div style="margin-top: 20px; text-align: right; border-top: 1px solid #eee; padding-top: 15px;">
                        ${getActions(item)}
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            switch (status) {
                case 1: return 'badge-success'; // 待使用
                case 2: return 'badge-warning'; // 使用中
                case 3: return 'badge-secondary'; // 已完成
                default: return 'badge-danger'; // 已取消/过期
            }
        }

        function getActions(item) {
            if (item.status === 1) { // 待使用
                return `
                    <button onclick="cancelReservation(${item.id})" class="btn btn-danger" style="margin-right: 10px;">取消预约</button>
                    <button onclick="checkIn(${item.id})" class="btn btn-primary">签到使用</button>
                `;
            } else if (item.status === 2) { // 使用中
                return `
                    <button onclick="checkOut(${item.id})" class="btn btn-warning">结束充电</button>
                `;
            } else if (item.status === 3) { // 已完成
                // Check if user has orders, maybe link to order
                return `<a href="orders.html" class="btn btn-outline" style="font-size:0.9rem;">查看订单</a>`;
            }
            return '';
        }

        async function cancelReservation(id) {
            if (!confirm('确定要取消这个预约吗？')) return;
            try {
                await API.cancelReservation(id);
                showToast('取消成功');
                loadReservations();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function checkIn(id) {
            try {
                await API.request(`/reservations/${id}/checkin`, { method: 'POST' });
                showToast('签到成功，开始计费');
                loadReservations();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function checkOut(id) {
            if (!confirm('确定要结束充电吗？这将生成订单。')) return;
            try {
                await API.request(`/reservations/${id}/checkout`, { method: 'POST' });
                // 自动创建订单
                await API.request(`/orders/create/${id}`, { method: 'POST' });
                showToast('已结束，请支付订单');
                setTimeout(() => window.location.href = 'orders.html', 1500);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
