<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 绿能充电后台</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="icon">⚡</span>
            <h2>绿能充电管理</h2>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html">
                <span class="icon">📊</span>
                <span>仪表盘</span>
            </a>
            <a href="stations.html">
                <span class="icon">🏢</span>
                <span>充电站管理</span>
            </a>
            <a href="users.html">
                <span class="icon">👥</span>
                <span>用户管理</span>
            </a>
            <a href="orders.html" class="active">
                <span class="icon">📋</span>
                <span>订单管理</span>
            </a>
            <a href="#" onclick="logout()">
                <span class="icon">🚪</span>
                <span>退出登录</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>订单管理</h1>
            <div class="flex gap-2">
                <select id="statusFilter" class="form-control" onchange="loadOrders()" style="width: 150px;">
                    <option value="">全部状态</option>
                    <option value="1">待支付</option>
                    <option value="2">已支付</option>
                    <option value="3">已完成</option>
                    <option value="0">已取消</option>
                </select>
            </div>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>订单号</th>
                    <th>用户</th>
                    <th>停车费</th>
                    <th>服务费</th>
                    <th>充电费</th>
                    <th>总额</th>
                    <th>状态</th>
                    <th>创建时间</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <tr>
                    <td colspan="8" class="text-center">加载中...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAuth();
            loadOrders();
        });

        function checkAdminAuth() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const token = localStorage.getItem('token');
            if (!token || user.role !== 1) {
                window.location.href = 'login.html';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function loadOrders() {
            const status = document.getElementById('statusFilter').value;
            try {
                const response = await API.request(`/admin/orders${status ? '?status=' + status : ''}`);
                renderOrders(response.data);
            } catch (error) {
                console.error('Load orders error:', error);
                document.getElementById('orderList').innerHTML =
                    '<tr><td colspan="8" class="text-center" style="color: #d63031;">加载失败</td></tr>';
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orderList');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">暂无订单</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>${o.orderNo}</td>
                    <td>${o.username || '-'}</td>
                    <td>¥${o.parkingFee || 0}</td>
                    <td>¥${o.serviceFee || 0}</td>
                    <td>¥${o.chargingFee || 0}</td>
                    <td style="font-weight: 600; color: #00b894;">¥${o.totalAmount || 0}</td>
                    <td><span class="badge ${getStatusBadge(o.status)}">${getStatusText(o.status)}</span></td>
                    <td>${formatDate(o.createdAt)}</td>
                </tr>
            `).join('');
        }

        function getStatusBadge(status) {
            switch (status) {
                case 1: return 'badge-warning';
                case 2: case 3: return 'badge-success';
                default: return 'badge-danger';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 1: return '待支付';
                case 2: return '已支付';
                case 3: return '已完成';
                default: return '已取消';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString('zh-CN');
        }
    </script>
</body>

</html>
