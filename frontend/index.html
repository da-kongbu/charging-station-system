<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿能充电 - 共享充电桩预约平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
            border-radius: 0 0 20px 20px;
        }

        .search-box {
            background: white;
            padding: 10px;
            border-radius: 50px;
            display: flex;
            max-width: 600px;
            margin: 20px auto 0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            border: none;
            flex: 1;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 40px;
            outline: none;
        }

        .search-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        .station-card {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .station-image {
            width: 200px;
            height: 150px;
            background-color: #eee;
            border-radius: 8px;
            object-fit: cover;
        }

        .station-info {
            flex: 1;
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .station-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .station-meta {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: flex;
            gap: 15px;
        }

        .pile-tags {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .pile-tag {
            background: #f1f2f6;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #636e72;
        }
    </style>
</head>

<body>
    <header></header>

    <div class="hero text-center">
        <div class="container">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">随时随地，绿色出行</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">搜索附近的共享充电桩，一键预约，轻松充电</p>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="输入充电站名称、城市或地址...">
                <button onclick="searchStations()" class="search-btn">搜索</button>
            </div>
        </div>
    </div>

    <main class="container">
        <div class="flex justify-between items-center mb-2">
            <h2 style="font-size: 1.5rem;">热门充电站</h2>
            <div class="flex gap-2">
                <button class="btn btn-outline" onclick="loadStations()">刷新列表</button>
            </div>
        </div>

        <div id="stationList">
            <!-- 充电站列表将渲染在这里 -->
            <div class="text-center" style="padding: 40px; color: var(--text-light);">
                加载中...
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadStations();

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchStations();
            });
        });

        async function loadStations() {
            try {
                const response = await API.getStations();
                renderStations(response.data);
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        async function searchStations() {
            const keyword = document.getElementById('searchInput').value;
            try {
                const response = await API.getStations(keyword);
                renderStations(response.data);
            } catch (error) {
                showToast('搜索失败: ' + error.message, 'error');
            }
        }

        function renderStations(stations) {
            const container = document.getElementById('stationList');

            if (!stations || stations.length === 0) {
                container.innerHTML = `
                    <div class="text-center" style="padding: 60px 0;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">🔋</div>
                        <h3 style="color: var(--text-light);">暂无充电站信息</h3>
                    </div>
                `;
                return;
            }

            container.innerHTML = stations.map(station => `
                <div class="card station-card">
                    <img src="https://via.placeholder.com/200x150?text=Charging+Station" class="station-image" alt="${station.name}">
                    <div class="station-info">
                        <div class="station-header">
                            <div>
                                <h3 class="station-title">${station.name}</h3>
                                <div class="station-meta" style="margin-top: 5px;">
                                    <span>📍 ${station.city} ${station.district} ${station.address}</span>
                                </div>
                            </div>
                            <span class="badge ${station.status === 1 ? 'badge-success' : 'badge-danger'}">
                                ${station.status === 1 ? '营业中' : '休息中'}
                            </span>
                        </div>
                        
                        <div class="station-meta">
                            <span>🕒 ${station.businessHours}</span>
                            <span>📞 ${station.contact || '暂无电话'}</span>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px;">
                            <div class="pile-tags">
                                <span class="pile-tag">快充 x${Math.ceil(station.pileCount * 0.4)}</span>
                                <span class="pile-tag">慢充 x${Math.ceil(station.pileCount * 0.6)}</span>
                                <span class="pile-tag" style="background-color: #e3f2fd; color: #1976d2;">
                                    空闲桩: ${station.availablePileCount} / ${station.pileCount}
                                </span>
                            </div>
                            
                            <a href="pages/station.html?id=${station.id}" class="btn btn-primary">
                                查看详情
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
