<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 绿能充电</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0;">

    <div class="card" style="width: 100%; max-width: 500px; padding: 40px;">
        <div class="text-center mb-2">
            <h1 style="color: var(--primary-color);">创建账号</h1>
            <p style="color: var(--text-light);">加入我们，开启绿色出行新体验</p>
        </div>

        <form id="registerForm">
            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" name="username" class="form-control" required minlength="3">
                </div>

                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" name="realName" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>密码 *</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>

            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" name="phone" class="form-control">
                </div>

                <div class="form-group">
                    <label>车牌号</label>
                    <input type="text" name="carPlate" class="form-control" placeholder="例如：京A12345">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">注册并登录</button>
        </form>

        <div class="text-center mt-2" style="font-size: 0.9rem;">
            已有账号？ <a href="login.html" style="color: var(--primary-color); font-weight: 600;">直接登录</a>
            <br>
            <a href="../index.html" style="color: var(--text-light); display: inline-block; margin-top: 10px;">返回首页</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await API.register(data);

                Auth.login(response.data.token, {
                    id: response.data.userId,
                    username: response.data.username,
                    role: response.data.role
                });

                showToast('注册成功！正在跳转...');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>

</html>
