<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 绿能充电</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header></header>

    <main class="container" style="padding-top: 20px;">
        <h1 class="mb-2">我的订单</h1>

        <div id="orderList">
            <div class="text-center">加载中...</div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.checkAuth();
            loadOrders();
        });

        async function loadOrders() {
            try {
                const response = await API.getMyOrders();
                renderOrders(response.data);
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        function renderOrders(list) {
            const container = document.getElementById('orderList');

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="text-center card">暂无订单记录</div>';
                return;
            }

            container.innerHTML = list.map(order => `
                <div class="card">
                    <div class="flex justify-between items-center mb-2" style="border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="color: var(--text-light); font-size: 0.9rem;">订单号: ${order.orderNo}</span>
                        <span class="badge ${order.status === 2 || order.status === 3 ? 'badge-success' : 'badge-warning'}">
                            ${getOrderStatusText(order.status)}
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-2" style="font-size: 1rem; color: var(--text-color);">
                        <div style="font-size: 1.2rem; font-weight: 700; color: var(--danger-color);">
                            ¥${order.totalAmount}
                        </div>
                        <div class="text-right">
                            ${order.paymentTime ? '支付时间: ' + formatDate(order.paymentTime) : '未支付'}
                        </div>
                    </div>

                    <div style="margin-top: 15px; font-size: 0.9rem; color: var(--text-light); background: #f9f9f9; padding: 10px; border-radius: 4px;">
                        <div class="flex justify-between"><span>停车费:</span> <span>¥${order.parkingFee}</span></div>
                        <div class="flex justify-between"><span>服务费:</span> <span>¥${order.serviceFee}</span></div>
                        <div class="flex justify-between"><span>充电费:</span> <span>¥${order.chargingFee}</span></div>
                    </div>

                    ${order.status === 1 ? `
                        <div style="margin-top: 20px; text-align: right;">
                            <button onclick="payOrder(${order.id})" class="btn btn-primary">立即支付</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function getOrderStatusText(status) {
            switch (status) {
                case 1: return '待支付';
                case 2: return '已支付';
                case 3: return '已完成';
                case 0: return '已取消';
                default: return '未知';
            }
        }

        async function payOrder(id) {
            try {
                // 模拟支付
                await API.payOrder(id);
                showToast('支付成功！');
                loadOrders();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
