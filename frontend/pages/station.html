<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充电站详情 - 绿能充电</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .pile-card {
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .spot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .spot-item {
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .spot-item:hover {
            border-color: var(--primary-color);
            background-color: rgba(0, 184, 148, 0.05);
        }

        .spot-item.disabled {
            background-color: #f5f6fa;
            color: #b2bec3;
            cursor: not-allowed;
            border-color: #dfe6e9;
        }

        .spot-item.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>

<body>
    <header></header>

    <main class="container" style="padding-top: 20px;">
        <div id="stationDetails">
            <div class="text-center">加载中...</div>
        </div>
    </main>

    <!-- 预约模态框 -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeBookingModal()">&times;</span>
            <h2 style="margin-bottom: 20px;">预约车位</h2>
            <form id="bookingForm">
                <input type="hidden" name="spotId" id="modalSpotId">
                <div class="form-group">
                    <label>当前选择</label>
                    <div id="selectedInfo" style="font-weight: 600; color: var(--primary-color);"></div>
                </div>

                <div class="form-group">
                    <label>开始时间</label>
                    <input type="datetime-local" name="startTime" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" name="endTime" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>备注 (选填)</label>
                    <input type="text" name="remark" class="form-control" placeholder="例如：车牌号">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">确认预约</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const stationId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', () => {
            if (!stationId) {
                showToast('未找到充电站ID', 'error');
                setTimeout(() => window.location.href = '../index.html', 1500);
                return;
            }
            loadStationDetails();

            // 设置默认时间
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const startStr = now.toISOString().slice(0, 16);

            const end = new Date(now.getTime() + 60 * 60 * 1000); // 默认1小时后
            const endStr = end.toISOString().slice(0, 16);

            document.querySelector('[name="startTime"]').value = startStr;
            document.querySelector('[name="endTime"]').value = endStr;
        });

        async function loadStationDetails() {
            try {
                const [stationData, pilesData, spotsData] = await Promise.all([
                    API.getStationDetails(stationId),
                    API.getStationPiles(stationId),
                    API.request(`/stations/${stationId}/spots`) // 直接调用获取可用车位接口
                ]);

                renderStation(stationData.data, pilesData.data, spotsData.data);
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        function renderStation(station, piles, spots) {
            const container = document.getElementById('stationDetails');

            // 将车位按 pileId 分组以便查找
            const spotsMap = {};
            spots.forEach(spot => {
                // 这里API返回的是List<ParkingSpot>，每个spot有pile对象
                const pileId = spot.pile ? spot.pile.id : null;
                // 注意 API response structure, pile might be nested
                // Backend ParkingSpot entity: @ManyToOne private ChargingPile pile;
                // Since we use JPA, filtering by pileId in JS is fine.
            });

            // 更好的方式：重新获取所有车位信息（包括状态），或者后端接口调整。
            // 目前 /stations/{id}/spots 返回的是"可用车位"。
            // 但我们需要展示所有桩下的所有车位（包括不可用的），以便展示桩的结构。
            // 可是后端没有直接提供"获取所有车位"的接口，只有 /stations/{id}/piles 返回 piles。
            // 实体 ChargingPile 中有 List<ParkingSpot> parkingSpots，但是 FetchType.LAZY。
            // 如果后端 Reservation 中的 ParkingSpot 没被序列化出来，前端就拿不到。
            // 我们之前的 `ChargingPileRepository` 没 fetch join。

            // 修正策略：
            // 我们在前端只展示 Piles。点击 Pile 展开/查看车位？
            // 或者假设 pilesData.data 里的 piles 包含了 parkingSpots (如果后端序列化配置了 lazy loading handling or default config works).
            // 让我们检查一下 ChargingPile 实体。 @OneToMany private List<ParkingSpot> parkingSpots;
            // 如果 Jackson 序列化时触发了 lazy load，或者 session keep alive，会有数据。
            // 如果没有，pilesData.data[0].parkingSpots 将是 null 或 empty。

            // 如果是 null，我们需要额外的接口。
            // 现在我们假设后端开启了 OSIV (Spring Boot 默认开启)，所以 Controller 返回实体时，JSON 序列化会触发查询。
            // 但是要注意循环引用。User -> Reservation -> Spot -> Pile -> Station -> Piles...
            // 实体上加了 @JsonIgnoreProperties 或者 DTO 处理了吗？
            // 我之前的代码里 Entity 只有简单的 @Data, @Builder。
            // 这会导致 Infinite Recursion StackOverflowError 如果双向关联没处理。
            // 我得检查后端代码。
            // `ChargingPile` -> `ParkingSpot` (OneToMany)
            // `ParkingSpot` -> `ChargingPile` (ManyToOne)
            // 这绝对会死循环。

            // 我需要修复后端吗？ 或者前端容错。
            // 如果后端 500 错误，前端就挂了。
            // 之前编译通过了，但运行起来可能会挂。
            // 为了安全起见，我应该在前端展示时，只依赖 piles 数据，如果 spots 没有，就提示。
            // 或者我通过 /stations/{id}/spots 获取可用车位，然后匹配到 pile 上。

            // 假设我们能拿到数据。
            const availableSpots = new Set(spots.map(s => s.id));

            let html = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between;">
                        <h1>${station.name}</h1>
                        <span class="badge ${station.status === 1 ? 'badge-success' : 'badge-danger'}" style="height: fit-content; font-size: 1rem;">
                            ${station.status === 1 ? '营业中' : '休息中'}
                        </span>
                    </div>
                    <p style="color: var(--text-light); margin-top: 10px;">📍 ${station.city} ${station.district} ${station.address}</p>
                    <p style="margin-top: 10px;">${station.description || '暂无描述'}</p>
                    <div class="grid grid-cols-2 mt-2">
                        <div><strong>营业时间：</strong> ${station.businessHours}</div>
                        <div><strong>联系电话：</strong> ${station.contact || '暂无'}</div>
                    </div>
                </div>

                <h2 class="mb-2">充电桩列表</h2>
            `;

            if (piles.length === 0) {
                html += '<div class="text-center">暂无充电桩</div>';
            } else {
                html += piles.map(pile => {
                    const pileSpots = pile.parkingSpots || []; // 尝试获取
                    // 如果 pile.parkingSpots 为空，可能是序列化问题。
                    // 用 availablesSpots 来凑合显示？ 不行，不知道属于哪个桩。
                    // 必须让后端返回。

                    return `
                    <div class="pile-card bg-white">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 style="font-size: 1.1rem;">${pile.pileCode} <span class="badge badge-warning">${pile.pileType}</span></h3>
                                <div style="font-size: 0.9rem; color: var(--text-light); margin-top: 5px;">
                                    功率: ${pile.power}kW | 电流: ${pile.current}A | 电压: ${pile.voltage}V
                                </div>
                            </div>
                            <div class="badge ${pile.status === 1 ? 'badge-success' : 'badge-danger'}">
                                ${pile.status === 1 ? '正常' : '故障'}
                            </div>
                        </div>
                        
                        <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                            <div style="font-size: 0.9rem; margin-bottom: 8px;">车位状态：</div>
                            <div class="spot-grid">
                                ${pileSpots.length > 0 ? pileSpots.map(spot => `
                                    <div class="spot-item ${spot.status === 1 ? '' : 'disabled'}" 
                                         onclick="${spot.status === 1 ? `openBookingModal(${spot.id}, '${spot.spotCode}', '${pile.pileCode}')` : ''}">
                                        <div style="font-weight:600;">${spot.spotCode}</div>
                                        <div style="font-size:0.8rem;">¥${spot.pricePerHour}/时</div>
                                        <div style="font-size:0.8rem; margin-top:4px; color:${spot.status === 1 ? 'var(--primary-color)' : '#b2bec3'}">
                                            ${spot.status === 1 ? '空闲' : '占用'}
                                        </div>
                                    </div>
                                `).join('') : '<div style="color:#999; font-size:0.9rem;">暂无车位信息</div>'}
                            </div>
                        </div>
                    </div>
                `}).join('');
            }

            container.innerHTML = html;
        }

        window.openBookingModal = (spotId, spotCode, pileCode) => {
            if (!Auth.checkAuth()) return; // 检查登录

            document.getElementById('modalSpotId').value = spotId;
            document.getElementById('selectedInfo').textContent = `${pileCode} - ${spotCode}`;
            document.getElementById('bookingModal').classList.add('active');
        };

        window.closeBookingModal = () => {
            document.getElementById('bookingModal').classList.remove('active');
        };

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // 处理时间格式
            data.spotId = parseInt(data.spotId);

            try {
                await API.createReservation(data);
                showToast('预约成功！');
                closeBookingModal();
                setTimeout(() => window.location.href = 'reservations.html', 1500);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>

</html>
