server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  profiles:
    include: secret
  application:
    name: charging-station-system
  
  # 默认使用 H2 内存数据库（开发环境）
  datasource:
    url: jdbc:h2:mem:chargingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # H2 控制台（开发环境可用）
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# JWT 配置
jwt:
  secret: ChargingStationSystemSecretKey2024VeryLongSecretKeyForJWTSigning
  expiration: 86400000  # 24 hours in milliseconds

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# 日志配置
logging:
  level:
    com.charging: DEBUG
    org.springframework.security: DEBUG

# AI 大模型配置（硅基流动 SiliconFlow）
ai:
  siliconflow:
    api-key: ${AI_SILICONFLOW_API_KEY:sk-placeholder}
    url: "https://api.siliconflow.cn/v1/chat/completions"
    model: "deepseek-ai/DeepSeek-V3"
    agent-timeout-seconds: 60 # 预约补问等场景最多等待 60 秒，超时后走后端业务兜底
    embedding-url: "https://api.siliconflow.cn/v1/embeddings"
    embedding-model: "BAAI/bge-m3"
