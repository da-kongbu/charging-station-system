<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充电站数据导入工具</title>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=3.0&ak=SOO3FVZZpkeh1kzHNSXNOtOB4HMCWXFA"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
            outline: none;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }

        .btn-success:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #d63031, #e17055);
            color: white;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .results {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .station-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .station-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-item:hover {
            background: #f8f9fa;
        }

        .station-name {
            font-weight: 600;
            color: #333;
        }

        .station-addr {
            font-size: 12px;
            color: #666;
        }

        .station-coords {
            font-size: 11px;
            color: #999;
            font-family: monospace;
        }

        .log {
            background: #1a1a2e;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin: 3px 0;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.success {
            color: #00ff88;
        }

        .log-entry.info {
            color: #74b9ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔌 全国充电站数据导入工具 (升级版)</h1>

        <div class="controls">
            <div class="form-row">
                <div class="form-group">
                    <label>选择省份</label>
                    <select id="province"></select>
                </div>
                <div class="form-group">
                    <label>选择城市</label>
                    <select id="city"></select>
                </div>
                <div class="form-group">
                    <label>搜索关键词</label>
                    <input type="text" id="keyword" value="充电站" placeholder="充电站、充电桩...">
                </div>
                <div class="form-group">
                    <label>搜索范围 (区县)</label>
                    <input type="text" id="bounds" placeholder="例如: 朝阳区">
                </div>
                <div class="form-group" style="flex: 0 0 auto;">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" onclick="startSearch()">🔍 开始搜索</button>
                </div>
            </div>
        </div>

        <div id="map"></div>

        <div class="results">
            <div class="stats">
                <div class="stat">
                    <div class="stat-num" id="totalCount">0</div>
                    <div class="stat-label">搜索结果</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="uniqueCount">0</div>
                    <div class="stat-label">去重后</div>
                </div>
                <div class="stat" style="flex: 1; text-align: right;">
                    <button class="btn btn-success" onclick="importToBackend()" id="importBtn" disabled>
                        📥 批量导入 (含随机桩/车位)
                    </button>
                    <button class="btn btn-danger" onclick="clearResults()" style="margin-left: 10px;">
                        🗑️ 清空
                    </button>
                </div>
            </div>

            <div class="station-list" id="stationList">
                <p style="text-align: center; color: #999; padding: 40px;">选择城市并点击"开始搜索"</p>
            </div>

            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let map;
        let allStations = [];
        const seenNames = new Set();

        // 中国主要城市数据
        const cityData = {
            "直辖市": ["北京", "上海", "天津", "重庆"],
            "广东省": ["广州", "深圳", "珠海", "佛山", "东莞", "中山", "惠州"],
            "浙江省": ["杭州", "宁波", "温州", "嘉兴", "湖州", "绍兴", "金华"],
            "江苏省": ["南京", "苏州", "无锡", "常州", "扬州", "徐州", "南通"],
            "四川省": ["成都", "绵阳", "德阳", "乐山", "宜宾"],
            "湖北省": ["武汉", "宜昌", "襄阳", "荆州"],
            "福建省": ["福州", "厦门", "泉州", "漳州"],
            "山东省": ["济南", "青岛", "烟台", "潍坊", "济宁"],
            "陕西省": ["西安", "宝鸡", "咸阳"],
            "湖南省": ["长沙", "株洲", "湘潭", "衡阳"],
            "安徽省": ["合肥", "芜湖", "蚌埠", "阜阳"],
            "河南省": ["郑州", "洛阳", "开封", "新乡"],
            "云南省": ["昆明", "大理", "丽江"],
            "广西": ["南宁", "桂林", "柳州"],
            "河北省": ["石家庄", "唐山", "保定", "雄安新区"],
            "辽宁省": ["沈阳", "大连"],
            "黑龙江省": ["哈尔滨", "大庆"],
            "吉林省": ["长春", "吉林"],
            "山西省": ["太原", "大同"],
            "江西省": ["南昌", "赣州"],
        };

        // 初始化城市选择器
        function initCitySelector() {
            const provinceSelect = document.getElementById('province');
            const citySelect = document.getElementById('city');

            // 填充省份
            for (const province in cityData) {
                const option = document.createElement('option');
                option.value = province;
                option.textContent = province;
                provinceSelect.appendChild(option);
            }

            // 省份变化事件
            provinceSelect.addEventListener('change', function () {
                const province = this.value;
                citySelect.innerHTML = '';

                if (province && cityData[province]) {
                    cityData[province].forEach(city => {
                        const option = document.createElement('option');
                        option.value = city;
                        option.textContent = city;
                        citySelect.appendChild(option);
                    });
                }

                // 触发城市变化以更新地图
                if (citySelect.options.length > 0) {
                    citySelect.value = citySelect.options[0].value;
                    updateMapCenter();
                }
            });

            // 默认选择北京
            provinceSelect.value = "直辖市";
            provinceSelect.dispatchEvent(new Event('change'));
            citySelect.value = "北京";
        }

        function updateMapCenter() {
            const city = document.getElementById('city').value;
            if (city && map) {
                map.centerAndZoom(city, 12);
            }
        }

        // 初始化地图
        function initMap() {
            map = new BMap.Map("map");
            map.centerAndZoom("北京", 12);
            map.enableScrollWheelZoom();
            map.addControl(new BMap.NavigationControl());
            initCitySelector();
        }

        // 日志
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML = `<div class="log-entry ${type}">[${time}] ${msg}</div>` + logDiv.innerHTML;
        }

        // 生成随机字符串
        function randomString(length) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 生成随机充电桩配置
        function generateRandomPiles() {
            const count = Math.floor(Math.random() * 8) + 2; // 2-10个桩
            const piles = [];

            for (let i = 0; i < count; i++) {
                const isDC = Math.random() > 0.3; // 70%概率是快充
                const pileType = isDC ? 'DC' : 'AC';
                const prefix = randomString(4); // 随机编码前缀

                piles.push({
                    pileCode: `P-${prefix}-${(i + 1).toString().padStart(2, '0')}`, // 例如 P-X7K2-01
                    pileType: pileType,
                    power: isDC ? 120 : 7,
                    voltage: isDC ? 750 : 220,
                    current: isDC ? 160 : 32,
                    brand: isDC ? '特来电' : '星星充电',
                    connectorType: isDC ? '国标DC' : '国标AC',
                    status: 1, // 正常
                    spots: [] // 车位
                });
            }
            return piles;
        }

        // 开始搜索
        function startSearch() {
            const city = document.getElementById('city').value;
            const keyword = document.getElementById('keyword').value;
            const bounds = document.getElementById('bounds').value;

            if (!city) {
                alert('请先选择城市');
                return;
            }

            log(`开始搜索: ${city} - ${keyword}${bounds ? ' (' + bounds + ')' : ''}`, 'info');

            // 设置地图中心到搜索城市
            map.centerAndZoom(city, 12);

            // 创建本地搜索对象
            const local = new BMap.LocalSearch(map, {
                renderOptions: { map: map, autoViewport: true },
                pageCapacity: 20,
                onSearchComplete: function (results) {
                    if (local.getStatus() === BMAP_STATUS_SUCCESS) {
                        const count = results.getCurrentNumPois();
                        log(`找到 ${count} 个结果`, 'success');

                        for (let i = 0; i < count; i++) {
                            const poi = results.getPoi(i);
                            addStation(poi, city);
                        }

                        // 搜索更多页（自动翻3页）
                        if (results.getNumPages() > 1 && results.getPageIndex() < 2) {
                            setTimeout(() => {
                                local.gotoPage(results.getPageIndex() + 1);
                            }, 1000);
                        }

                        updateUI();
                    } else {
                        log(`搜索失败: ${local.getStatus()}`, 'error');
                    }
                }
            });

            // 执行搜索
            if (bounds) {
                local.search(keyword + ' ' + bounds);
            } else {
                local.search(keyword);
            }
        }

        // 添加充电站
        function addStation(poi, city) {
            if (!poi || !poi.point) return;

            const name = poi.title || poi.name;
            if (seenNames.has(name)) return;
            seenNames.add(name);

            // 生成随机充电桩数据
            const piles = generateRandomPiles();

            const station = {
                name: name,
                address: poi.address || '',
                city: city,
                district: extractDistrict(poi.address),
                longitude: poi.point.lng,
                latitude: poi.point.lat,
                phone: poi.phoneNumber || '',
                uid: poi.uid,
                piles: piles // 附带生成的随机桩
            };

            allStations.push(station);
            log(`+ ${name} (生成 ${piles.length} 个桩)`, 'success');
        }

        // 提取区县
        function extractDistrict(address) {
            if (!address) return '';
            const match = address.match(/([\u4e00-\u9fa5]+区|[\u4e00-\u9fa5]+县)/);
            return match ? match[1] : '';
        }

        // 更新UI
        function updateUI() {
            document.getElementById('totalCount').textContent = seenNames.size;
            document.getElementById('uniqueCount').textContent = allStations.length;
            document.getElementById('importBtn').disabled = allStations.length === 0;

            const list = document.getElementById('stationList');
            if (allStations.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">暂无数据</p>';
                return;
            }

            list.innerHTML = allStations.map((s, i) => `
                <div class="station-item">
                    <div>
                        <div class="station-name">${i + 1}. ${s.name}</div>
                        <div class="station-addr">📍 ${s.address}</div>
                        <div class="station-coords">
                            桩数: <b>${s.piles.length}</b> 个 | 
                            包含快充: ${s.piles.filter(p => p.pileType === 'DC').length} | 
                            慢充: ${s.piles.filter(p => p.pileType === 'AC').length}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 清空结果
        function clearResults() {
            allStations = [];
            seenNames.clear();
            map.clearOverlays();
            updateUI();
            log('已清空所有数据', 'info');
        }

        // 导入到后端
        async function importToBackend() {
            if (allStations.length === 0) {
                alert('没有数据可导入');
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录管理员账号（token丢失）');
                return;
            }

            if (!confirm(`确定要导入 ${allStations.length} 个充电站到数据库吗？\n\n将自动创建关联的充电桩和车位。`)) {
                return;
            }

            log(`开始批量导入...`, 'info');

            let success = 0;
            let failed = 0;

            for (const stationData of allStations) {
                try {
                    // 1. 创建充电站
                    const stationRes = await apiCall('/api/admin/stations', 'POST', {
                        name: stationData.name,
                        address: stationData.address,
                        city: stationData.city,
                        district: stationData.district,
                        longitude: stationData.longitude,
                        latitude: stationData.latitude,
                        contact: (stationData.phone || '').substring(0, 20), // 截断防止超长
                        businessHours: '24小时营业',
                        description: `来自百度地图数据 (随机分配 ${stationData.piles.length} 个桩)`
                    });

                    if (stationRes.code !== 200) throw new Error(stationRes.message || '创建站点失败');
                    const stationId = stationRes.data.id;
                    log(`> 站点创建成功: ${stationData.name}`, 'success');

                    // 2. 创建充电桩和车位
                    for (const pileData of stationData.piles) {
                        // 创建桩
                        const pileRes = await apiCall(`/api/admin/piles?stationId=${stationId}`, 'POST', {
                            pileCode: pileData.pileCode,
                            pileType: pileData.pileType,
                            power: pileData.power,
                            voltage: pileData.voltage,
                            current: pileData.current,
                            brand: pileData.brand,
                            connectorType: pileData.connectorType,
                            status: pileData.status
                        });

                        if (pileRes.code === 200) {
                            const pileId = pileRes.data.id;
                            // 为每个桩创建2个车位
                            for (let k = 1; k <= 2; k++) {
                                const spotCode = `${pileData.pileCode}-0${k}`; // 例如 P-X7K2-01-01
                                await apiCall(`/api/admin/spots?pileId=${pileId}`, 'POST', {
                                    spotCode: spotCode,
                                    spotType: 'STANDARD',
                                    pricePerHour: pileData.pileType === 'DC' ? 2.0 : 1.5,
                                    serviceFee: 0.8,
                                    status: 0 // 空闲
                                });
                            }
                        }
                    }

                    success++;
                } catch (e) {
                    failed++;
                    log(`✗ 导入失败: ${stationData.name} - ${e.message}`, 'error');
                }
            }

            log(`导入完成! 成功: ${success}, 失败: ${failed}`, success > 0 ? 'success' : 'error');
            alert(`导入完成!\n成功: ${success}\n失败: ${failed}`);
        }

        async function apiCall(url, method, body) {
            const token = localStorage.getItem('token');
            const response = await fetch('http://localhost:8080' + url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(body)
            });
            return await response.json();
        }

        // 初始化
        window.onload = function () {
            initMap();
            log('地图初始化完成', 'success');
            log('使用说明: 选择城市 → 点击搜索 → 点击导入', 'info');
        };
    </script>
</body>

</html>
